name: brodyaga

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_NATIVE_URL:-http://host.docker.internal:11434}
      WEBUI_NAME: ${WEBUI_NAME:-БРОДЯГА}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
